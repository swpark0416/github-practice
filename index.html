<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>API 통신 실습</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        button { padding: 10px 16px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .post-card { background: #f8f9fa; border: 1px solid #ddd; padding: 15px; margin-top: 10px; border-radius: 8px; }
    </style>
</head>
<body>
    <h2>📡 백엔드 서버와 통신하기 (API)</h2>
    <button onclick="getPost()">서버에서 1번 글 불러오기</button>

    <div id="result">
        <!-- 서버에서 받아온 데이터가 들어올 자리 -->
    </div>

    <script>
        // 백엔드 API를 호출하는 함수
        function getPost() {
            document.getElementById('result').innerHTML = "<p>데이터 불러오는 중...⏳</p>";

            // 1. fetch()로 인터넷 상의 백엔드 서버 주소로 GET 요청
            fetch('https://jsonplaceholder.typicode.com/posts/1')
                .then(response => response.json()) // 2. 서버가 준 응답을 JS 객체로 변환
                .then(data => {
                    // 3. 변환된 데이터를 화면에 보여주기
                    document.getElementById('result').innerHTML = `
                        <div class="post-card">
                            <h3>📌 제목: ${data.title}</h3>
                            <p>${data.body}</p>
                            <small>글 번호: ${data.id} | 작성자 ID: ${data.userId}</small>
                        </div>
                    `;
                })
                .catch(error => {
                    console.error('에러 발생:', error);
                    alert('데이터를 불러오지 못했습니다.');
                });
        }
    </script>
</body>
</html>
