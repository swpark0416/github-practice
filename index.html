<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>JS 기초 다지기</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .box { background: #f0f4f8; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
        button { padding: 8px 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🚀 JavaScript 기초 연습</h1>
    
    <div class="box">
        <h3>1. 배열(Array) 데이터 출력</h3>
        <p id="todoDisplay">할 일 목록이 여기에 표시됩니다.</p>
        <button onclick="showTodoList()">할 일 불러오기</button>
    </div>

    <div class="box">
        <h3>2. 객체(Object) 데이터 출력</h3>
        <p id="userDisplay">사용자 정보가 여기에 표시됩니다.</p>
        <button onclick="showUserInfo()">내 정보 불러오기</button>
    </div>

    <script>
        // 1. 배열 데이터 생성 (const 사용)
        const todos = ["1. HTML 뼈대 완성", "2. CSS 스타일 적용", "3. JS 기초 마스터"];

        // 2. 객체 데이터 생성 (const 사용)
        const profile = {
            name: "개발 지망생",
            goal: "React 마스터하기",
            level: 1
        };

        // 배열을 화면에 띄우는 함수
        function showTodoList() {
            // join(', ') : 배열의 원소들을 쉼표로 연결해주는 JS 내장 기능
            document.getElementById('todoDisplay').innerText = todos.join(' / ');
        }

        // 객체를 화면에 띄우는 함수
        function showUserInfo() {
            document.getElementById('userDisplay').innerText = 
                `이름: ${profile.name} | 목표: ${profile.goal} | 레벨: Lv.${profile.level}`;
        }
    </script>
</body>
</html>
