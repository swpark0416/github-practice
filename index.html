<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3단계: JS + 짧은 CSS</title>
    <!-- 👇 딱 5줄짜리 아주 짧은 CSS -->
    <style>
        body { text-align: center; margin-top: 50px; background-color: #f9f9f9; }
        h1 { color: #2b5680; }
        button { padding: 8px 16px; background-color: #28a745; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>🔥 나의 오늘 다짐</h1>
    <p id="targetText">스마트폰으로도 꾸준히 코딩 공부하기!</p>
    
    <button onclick="checkGoal()">달성 완료 표시하기</button>
    
    <p id="status">상태: 진행 중 ⏳</p>

    <script>
        function checkGoal() {
            document.getElementById('status').innerText = "상태: 목표 달성 성공! 🎉";
            document.getElementById('status').style.color = "green";
            alert("축하합니다! 오늘 다짐을 달성하셨습니다!");
        }
    </script>
</body>
</html>
