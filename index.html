<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>API POST 실습</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 400px; margin: auto; }
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        input, textarea { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .result-card { background: #e9ecef; padding: 15px; border-radius: 6px; margin-top: 15px; }
    </style>
</head>
<body>
    <h2>✍️ 서버에 새 글 등록하기 (POST)</h2>

    <div class="input-group">
        <input type="text" id="titleInput" placeholder="제목을 입력하세요">
        <textarea id="bodyInput" placeholder="내용을 입력하세요" rows="3"></textarea>
        <button onclick="createPost()">서버로 전송하기</button>
    </div>

    <div id="result"></div>

    <script>
        function createPost() {
            const title = document.getElementById('titleInput').value;
            const body = document.getElementById('bodyInput').value;

            if (!title || !body) {
                alert("제목과 내용을 모두 입력해 주세요!");
                return;
            }

            document.getElementById('result').innerHTML = "<p>서버로 데이터 전송 중...🚀</p>";

            // 1. fetch의 두 번째 인자로 옵션 객체를 전달합니다.
            fetch('https://jsonplaceholder.typicode.com/posts', {
                method: 'POST', // 요청 방식
                headers: {
                    'Content-Type': 'application/json' // 서버에게 "JSON 형태로 데이터 보낸다"고 알려줌
                },
                // 자바스크립트 객체를 JSON 문자열로 변환하여 전송
                body: JSON.stringify({
                    title: title,
                    body: body,
                    userId: 1
                })
            })
            .then(response => response.json()) // 서버가 등록 결과를 JSON으로 응답
            .then(data => {
                // 2. 서버가 가짜로 생성해 준 ID(보통 101번)와 함께 응답 결과를 화면에 표시
                document.getElementById('result').innerHTML = `
                    <div class="result-card">
                        <h3>✅ 서버 등록 성공!</h3>
                        <p><strong>생성된 ID:</strong> ${data.id}</p>
                        <p><strong>제목:</strong> ${data.title}</p>
                        <p><strong>내용:</strong> ${data.body}</p>
                    </div>
                `;
            })
            .catch(error => {
                console.error('에러 발생:', error);
                alert('등록에 실패했습니다.');
            });
        }
    </script>
</body>
</html>
