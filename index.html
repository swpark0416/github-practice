<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>API PUT & DELETE 실습</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 450px; margin: auto; }
        .box { border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-bottom: 20px; background: #f9f9f9; }
        input { width: 90%; padding: 8px; margin-bottom: 8px; }
        button { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; }
        .btn-update { background-color: #ffc107; color: black; }
        .btn-delete { background-color: #dc3545; }
        #result { background: #eef2f5; padding: 15px; border-radius: 6px; }
    </style>
</head>
<body>
    <h2>✏️ 서버 데이터 수정 & 삭제</h2>

    <!-- 수정 섹션 -->
    <div class="box">
        <h3>1번 글 수정하기 (PUT)</h3>
        <input type="text" id="updateTitle" value="수정할 새 제목입니다">
        <button class="btn-update" onclick="updatePost()">1번 글 수정 (PUT)</button>
    </div>

    <!-- 삭제 섹션 -->
    <div class="box">
        <h3>1번 글 삭제하기 (DELETE)</h3>
        <button class="btn-delete" onclick="deletePost()">1번 글 삭제 (DELETE)</button>
    </div>

    <div id="result">
        <p>버튼을 누르면 서버 응답 결과가 나옵니다.</p>
    </div>

    <script>
        // 1. PUT 요청 (데이터 수정)
        function updatePost() {
            const newTitle = document.getElementById('updateTitle').value;
            document.getElementById('result').innerHTML = "<p>수정 요청 중...⏳</p>";

            // /posts/1 처럼 수정할 글의 ID를 URL 뒤에 붙입니다.
            fetch('https://jsonplaceholder.typicode.com/posts/1', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    id: 1,
                    title: newTitle,
                    body: '내용도 함께 업데이트되었습니다.',
                    userId: 1
                })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('result').innerHTML = `
                    <h4>✅ 수정 성공!</h4>
                    <p><strong>수정된 ID:</strong> ${data.id}</p>
                    <p><strong>새 제목:</strong> ${data.title}</p>
                `;
            })
            .catch(err => console.error(err));
        }

        // 2. DELETE 요청 (데이터 삭제)
        function deletePost() {
            document.getElementById('result').innerHTML = "<p>삭제 요청 중...⏳</p>";

            // 삭제할 글의 ID(1번)를 지정하여 DELETE 메서드로 호출합니다.
            fetch('https://jsonplaceholder.typicode.com/posts/1', {
                method: 'DELETE'
            })
            .then(response => {
                // DELETE 요청 성공 시 서버는 빈 객체({})나 200/204 상태코드를 넘겨줍니다.
                if (response.ok) {
                    document.getElementById('result').innerHTML = `
                        <h4>🗑️ 삭제 성공!</h4>
                        <p>1번 글이 서버에서 정상적으로 삭제 처리되었습니다.</p>
                    `;
                }
            })
            .catch(err => console.error(err));
        }
    </script>
</body>
</html>
