<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>GitHub 형상 관리 실습</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #2c3e50; font-size: 22px; }
        .quote-box {
            background-color: #f8f9fa;
            border-left: 4px solid #007bff;
            padding: 15px;
            margin: 20px 0;
            font-style: italic;
            color: #495057;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .profile {
            margin-top: 25px;
            border-top: 1px solid #eee;
            padding-top: 15px;
            text-align: left;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 GitHub 형상 관리 실습</h1>
        
        <!-- 👇 새로 추가된 명언 영역 -->
        <div class="quote-box" id="quoteDisplay">
            버튼을 눌러 오늘의 명언을 확인하세요!
        </div>
        <button onclick="generateQuote()">✨ 명언 불러오기</button>
        
        <div class="profile">
            <h3>👤 작성자 프로필</h3>
            <p><strong>이름:</strong> swpark0416</p>
            <p><strong>상태:</strong> 세 번째 브랜치(JS 기능) 작업 중!</p>
        </div>
    </div>

    <!-- 👇 자바스크립트 로직 -->
    <script>
        const quotes = [
            "시작하는 방법은 말하는 것을 멈추고 행동하는 것이다. - 월트 디즈니",
            "위대한 일을 하는 유일한 방법은 당신이 하는 일을 사랑하는 것이다. - 스티브 잡스",
            "오늘 할 수 있는 일에 전력을 다하라. - 괴테",
            "성공은 매일 반복한 작은 노력들의 합이다. - 로버트 콜리어",
            "Git 커밋 한 줄이 모여 위대한 프로그램이 된다. - 개발자 격언"
        ];

        function generateQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            document.getElementById('quoteDisplay').innerText = quotes[randomIndex];
        }
    </script>
</body>
</html>
