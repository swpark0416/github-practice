<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>1단계: HTML 뼈대 만들기</title>
</head>
<body>
    <!-- 제목 뼈대 -->
    <h1>🔥 나의 오늘 다짐</h1>
    
    <!-- 본문 내용 뼈대 -->
    <p id="targetText">스마트폰으로도 꾸준히 코딩 공부하기!</p>
    
    <!-- 버튼 뼈대 -->
    <button id="checkBtn">달성 완료 표시하기</button>

    <!-- 상태 표시 뼈대 -->
    <p id="status">상태: 진행 중 ⏳</p>
</body>
</html>
